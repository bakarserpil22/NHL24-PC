[Graphics]
TargetRes=1920x1080
FramerateLimit=60
VSync=1
MTL_HUD_ENABLED=0

[Memory]
# Set VRAM_Pool_Size=4096 for 8GB cards like RTX 3050 to avoid crowd stutter
VRAM_Pool_Size=4096
DynamicGarbageCollection=1

[Advanced]
# Add -DisableVolumetrics in launch arguments or set it here
DisableVolumetrics=1
AudioThreadFormat=48000
